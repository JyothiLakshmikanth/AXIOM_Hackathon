# Cloud Build configuration for AXIOM Orchestrator
# Deploy to GCP Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/axiom-orchestrator:$BRANCH_NAME-$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/axiom-orchestrator:latest'
      - '-f'
      - 'Dockerfile.new'
      - '.'

  # Step 2: Push image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/axiom-orchestrator:$BRANCH_NAME-$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-cloud-run'
    args:
      - run
      - deploy
      - axiom-orchestrator-$BRANCH_NAME
      - --image=gcr.io/$PROJECT_ID/axiom-orchestrator:$BRANCH_NAME-$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
      - --max-instances=10
      - --min-instances=1
      - --no-allow-unauthenticated
      - --set-env-vars=ENVIRONMENT=$BRANCH_NAME,GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --service-account=axiom-orchestrator@$PROJECT_ID.iam.gserviceaccount.com

  # Step 4: Verify deployment
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'verify-deployment'
    args:
      - run
      - services
      - describe
      - axiom-orchestrator-$BRANCH_NAME
      - --region=us-central1

# Image to be pushed to GCR
images:
  - 'gcr.io/$PROJECT_ID/axiom-orchestrator:$BRANCH_NAME-$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/axiom-orchestrator:latest'

# Build timeout
timeout: '3600s'

# Substitutions
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'axiom-orchestrator'

# Options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Triggers on push to main or develop branches
onFailure:
  - 'NOTIFY'

