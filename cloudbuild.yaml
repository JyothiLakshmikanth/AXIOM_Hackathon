# AXIOM POC - Cloud Build configuration
# Builds the Streamlit application, pushes it to Artifact Registry,
# and deploys it to Cloud Run.

steps:
  # 1. Build the Streamlit container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/axiom-poc/axiom-poc:$BUILD_ID'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/axiom-poc/axiom-poc:$BUILD_ID'

  # 3. Deploy Streamlit to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-${_ENVIRONMENT}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/axiom-poc/axiom-poc:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--max-instances=1'
      - '--min-instances=0'
      - '--allow-unauthenticated'
      - '--session-affinity'
      - '--update-env-vars=ENVIRONMENT=${_ENVIRONMENT},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCP_PROJECT=$PROJECT_ID,GCP_PROJECT_ID=$PROJECT_ID,GEMINI_API_KEY=AQ.Ab8RN6KVtoHm0-SlVOsZuuoGJypnNSxVXBXfPoXc0wcXJ22DsQ,GOOGLE_API_KEY=AQ.Ab8RN6KVtoHm0-SlVOsZuuoGJypnNSxVXBXfPoXc0wcXJ22DsQ,GITHUB_TOKEN=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,VERTEX_AI_GEMINI_MODEL=gemini-1.5-flash-001,GOOGLE_CLOUD_LOCATION=${_REGION}'
      - '--service-account=axiom-orchestrator@$PROJECT_ID.iam.gserviceaccount.com'
  # 4. Verify the Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'verify-deployment'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'describe'
      - '${_SERVICE_NAME}-${_ENVIRONMENT}'
      - '--region=${_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/axiom-poc/axiom-poc:$BUILD_ID'

timeout: '3600s'

substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'axiom-poc'
  _ENVIRONMENT: 'prod'

options:
  machineType: 'E2_MEDIUM'

